name: CI

# Mirror of this repository's GitLab CI validation jobs, published on GitHub purely for public
# visibility (GitLab remains the source of truth for development — see CONTRIBUTING.md). Only
# the correctness-signal jobs are mirrored here; build/packaging/release automation
# (build:portable:windows included — a packaging job, not a correctness signal) stays
# GitLab-only.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

env:
  NODE_ENV: test
  CI: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
