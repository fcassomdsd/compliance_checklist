image: node:latest
stages:
  - lint
  - test
  - build

variables:
  NODE_ENV: test
  CI: 'true'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

before_script:
  - npm ci

lint:
  stage: lint
  script:
    - echo "🔍 Running ESLint..."
    - npm run lint
  only:
    - develop
    - merge_requests

test:
  stage: test
  script:
    - echo "🧪 Running tests..."
    - npm test
  only:
    - develop
    - merge_requests

coverage:
  stage: test
  script:
    - echo "📊 Running tests with coverage..."
    - npm run test:coverage
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 30 days
  only:
    - develop
    - merge_requests

build:
  stage: build
  script:
    - echo "🏗️ Building application..."
    - npm run build
  only:
    - main
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

build:portable:windows:
  stage: build
  image: mcr.microsoft.com/windows/servercore:ltsc2019
  script:
    - echo "🪟 Building Windows portable..."
    - npm run build
    - npm run build:win-portable
  only:
    - main
  artifacts:
    paths:
      - dist-portable/win-unpacked/
    expire_in: 1 week

build:portable:macos:
  stage: build
  image: node:latest
  script:
    - echo "🍎 Building macOS portable..."
    - npm run build
    - npx electron-builder --mac dmg
  only:
    - main
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
