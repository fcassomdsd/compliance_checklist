image: node:latest
stages:
  - lint
  - test
  - build
  - release

variables:
  NODE_ENV: test
  CI: 'true'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

before_script:
  - npm ci

lint:
  stage: lint
  script:
    - echo "🔍 Running ESLint..."
    - npm run lint
  only:
    - develop
    - merge_requests

test:
  stage: test
  script:
    - echo "🧪 Running tests..."
    - npm test
  only:
    - develop
    - merge_requests

coverage:
  stage: test
  script:
    - echo "📊 Running tests with coverage..."
    - npm run test:coverage
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 30 days
  only:
    - develop
    - merge_requests

build:
  stage: build
  script:
    - echo "🏗️ Building application..."
    - npm run build
  only:
    - main
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

build:portable:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  before_script:
    - npm install  # Essential: Windows needs its own native binaries
  script:
    - echo "🪟 Building Windows portable..."
    - npm run build
    - npm run build:win-portable
  only:
    - main
  artifacts:
    paths:
      - dist-portable\win-unpacked\
    expire_in: 1 week

e2e:smoke:
  stage: test
  image: mcr.microsoft.com/playwright:v1.52.0-jammy
  before_script:
    - npm ci
    - npm run e2e:setup
    - npm run build
  script:
    - echo "🧭 Running Electron E2E smoke tests..."
    - xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test e2e/specs/electron.smoke.spec.mjs e2e/specs/electron.followup.spec.mjs
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

e2e:full:
  stage: test
  image: mcr.microsoft.com/playwright:v1.52.0-jammy
  before_script:
    - npm ci
    - npm run e2e:setup
    - npm run build
  script:
    - echo "🧪 Running full Electron E2E test suite..."
    - xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm run e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Release stage - creates a GitLab Release tagged with the current date
# whenever a pipeline runs on main (i.e. on every merge to main).
compute_release_tag:
  stage: release
  image: alpine:latest
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "RELEASE_TAG=$(date +%Y-%m-%d)" >> release.env
  artifacts:
    reports:
      dotenv: release.env

create_release:
  stage: release
  needs: ["compute_release_tag"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "Creating release $RELEASE_TAG"
  release:
    tag_name: '$RELEASE_TAG'
    description: "Release $RELEASE_TAG"
    ref: '$CI_COMMIT_SHA'

